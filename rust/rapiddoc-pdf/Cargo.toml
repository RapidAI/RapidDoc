[package]
repository = "https://github.com/RapidAI/RapidDoc"
description = "PDFium rendering and PDF text extraction for RapidDoc."
include = [
    "src/**",
    "build.rs",
    "build/**",
    "native/**",
    "vendor/**",
    "assets/**",
    "resources/**",
    "models.json",
    "licenses/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
name = "rapiddoc-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
pdfium-render.workspace = true
rapiddoc-core = { version = "=0.1.1", path = "../rapiddoc-core" }
serde.workspace = true
serde_json.workspace = true
docvortex-core = { package = "rapiddoc-docvortex-core", version = "=0.1.0", path = "../vendor/docvortex-core" }
unicode-normalization = "=0.1.24"
docvortex-pdfium-paths = { package = "rapiddoc-docvortex-pdfium-paths", version = "=0.1.0", path = "../vendor/docvortex-pdfium-paths" }
libloading = "=0.9.0"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
parking_lot = "=0.12.5"
lopdf = { package = "rapiddoc-lopdf", version = "=0.42.0", path = "../vendor/lopdf-f64", default-features = false }


regex = "1"
