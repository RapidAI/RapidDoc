[package]
repository = "https://github.com/RapidAI/RapidDoc"
description = "Microsoft Office document parsing for RapidDoc."
include = [
    "src/**",
    "build.rs",
    "build/**",
    "native/**",
    "vendor/**",
    "assets/**",
    "resources/**",
    "models.json",
    "licenses/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
name = "rapiddoc-office"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rapiddoc-core = { version = "=0.1.0", path = "../rapiddoc-core" }
zip = { version = "=9.1.3", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
roxmltree = "=0.21.2"
cfb = "=0.15.0"
encoding_rs = "=0.8.42"
serde_json = { workspace = true, features = ["raw_value", "arbitrary_precision"] }
serde = { workspace = true, features = ["rc"] }
regex = "=1.13.1"
num-bigint = "=0.4.8"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
base64 = "=0.13.1"
sha2 = "0.10"
clipper-sys = "=0.8.0"
png = "=0.18.1"
freetype-sys = "=0.20.1"
flate2 = "=1.1.10"
turbojpeg = { version = "=1.5.1", default-features = false, features = ["cmake"] }

image-codecs = { package = "image", version = "=0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "tiff",
    "webp",
    "pnm",
    "tga",
    "ico",
    "png",
] }

tiff = "=0.11.3"

resvg = { version = "=0.48.0", default-features = false, features = ["raster-images", "text"] }

[build-dependencies]
cc = "1.2"
