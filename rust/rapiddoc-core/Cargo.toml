[package]
repository = "https://github.com/RapidAI/RapidDoc"
description = "Shared document types and errors for RapidDoc."
include = [
    "src/**",
    "build.rs",
    "build/**",
    "native/**",
    "vendor/**",
    "assets/**",
    "resources/**",
    "models.json",
    "licenses/**",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]
name = "rapiddoc-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
