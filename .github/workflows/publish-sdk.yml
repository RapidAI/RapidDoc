name: Publish native SDK (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Run on matching sdk-vVERSION tag; original Python uses separate vVERSION tags
        default: '0.1.1'
        required: true
        type: string
      source_run_id:
        description: Reuse artifacts from a successful SDK build run; empty rebuilds all platforms
        default: ''
        type: string
      target:
        description: Publish one destination at a time
        type: choice
        options: [artifacts-only, pypi, npm, maven, github]
        default: artifacts-only
      publish:
        description: Actually upload to the selected public registry
        type: boolean
        default: false
      include_cuda:
        description: Requires configured Linux AND Windows self-hosted CUDA runners
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: sdk-publish-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INCLUDE_CUDA: ${{ inputs.include_cuda }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, subprocess, sys, urllib.request
          subprocess.run([sys.executable, 'scripts/release/common.py', os.environ['VERSION']] +
                         (['--publishing'] if os.environ['PUBLISH'] == 'true' else []), check=True)
          source = os.environ['SOURCE_RUN_ID']
          if source:
            if not source.isdigit(): raise ValueError('Use a numeric SDK build run ID')
            def get(path):
              request = urllib.request.Request(
                os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + path,
                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response: return json.load(response)
            build = get('/actions/runs/' + source)
            if build['conclusion'] != 'success' or build['path'] != '.github/workflows/sdk-build.yml':
              raise ValueError('Source must be a successful SDK build workflow')
            changes = subprocess.check_output(
              ['git', 'diff', '--name-only', build['head_sha'], 'HEAD'], text=True).splitlines()
            if set(changes) - {'.github/workflows/publish-sdk.yml'}:
              raise ValueError('Source build must contain exactly the release code; only publisher workflow changes are allowed')
            artifacts = get('/actions/runs/' + source + '/artifacts?per_page=100')['artifacts']
            names = {a['name'] for a in artifacts if not a['expired']}
            expected = {'sdk-windows-x86_64', 'sdk-linux-x86_64', 'sdk-macos-x86_64', 'sdk-macos-aarch64', 'sdk-linux-aarch64', 'sdk-windows-aarch64'}
            if os.environ['INCLUDE_CUDA'] == 'true':
              expected |= {'sdk-windows-x86_64-cuda', 'sdk-linux-x86_64-cuda'}
            if not expected <= names: raise ValueError('Verified build artifacts are missing or expired')
            print('Reusing verified SDK build:', source, build['head_sha'])


  build:
    if: inputs.source_run_id == ''
    needs: guard
    uses: ./.github/workflows/sdk-build.yml
    with:
      version: ${{ inputs.version }}
      include_cuda: ${{ inputs.include_cuda }}

  ready:
    needs: [guard, build]
    if: always() && !cancelled() && needs.guard.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - run: echo "SDK artifacts are ready for the selected destination"

  pypi:
    if: always() && !cancelled() && needs.ready.result == 'success' && inputs.publish && inputs.target == 'pypi'
    needs: ready
    runs-on: ubuntu-22.04
    environment: sdk-pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PYPI_RUST_TOKEN: ${{ secrets.PYPI_RUST_TOKEN || secrets.RAPID_DOC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Select one wheel per OS (CUDA-capable build when requested)
        shell: python
        run: |
          from pathlib import Path
          import shutil
          destination = Path('dist'); destination.mkdir()
          for os_name in ['windows-x86_64', 'linux-x86_64', 'macos-x86_64', 'macos-aarch64', 'linux-aarch64', 'windows-aarch64']:
            paths = sorted(Path('artifacts').glob('sdk-' + os_name + '*/python/*.whl'))
            cuda = [p for p in paths if p.parent.parent.name.endswith('-cuda')]
            selected = cuda or paths
            if len(selected) != 1: raise ValueError(f'Expected exactly one selected wheel for {os_name}: {selected}')
            shutil.copy2(selected[0], destination / selected[0].name)
      - name: Publish with PyPI Trusted Publishing
        if: env.PYPI_RUST_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish with configured PyPI token
        if: env.PYPI_RUST_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_RUST_TOKEN }}

  npm:
    if: always() && !cancelled() && needs.ready.result == 'success' && inputs.publish && inputs.target == 'npm'
    needs: ready
    runs-on: ubuntu-22.04
    environment: sdk-npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Assemble the cross-platform public package
        run: python scripts/release/npm_packages.py --output build/release/npm-root
      - name: Publish platform packages before loader (OIDC or bootstrap token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python scripts/release/publish_npm.py

  maven:
    if: always() && !cancelled() && needs.ready.result == 'success' && inputs.target == 'maven'
    needs: ready
    runs-on: ubuntu-22.04
    environment: sdk-maven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Assemble/sign Maven Central bundle; upload only when explicitly enabled
        env:
          PUBLISH: ${{ inputs.publish }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/release/publish_central.py', '--artifacts', 'artifacts'] +
                         (['--publish'] if os.environ['PUBLISH'] == 'true' else []), check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-deployment-receipt
          path: |
            build/release/central-deployment-id.txt
            build/release/central-status.json

  github:
    if: always() && !cancelled() && needs.ready.result == 'success' && inputs.publish && inputs.target == 'github'
    needs: ready
    runs-on: ubuntu-22.04
    environment: sdk-github
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id || github.run_id }}
      - name: Create/update draft release and publish the Go submodule tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sdk-v$VERSION"
          go_tag="bindings/go/v$VERSION"
          commit="$(git rev-parse HEAD)"
          if git rev-parse "$go_tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$go_tag^{commit}")" = "$commit"
          else
            git tag "$go_tag" "$commit"
            git push origin "refs/tags/$go_tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --title "Native SDK $VERSION" --generate-notes
          fi
          find artifacts -name 'rapiddoc-native-*.zip' -print0 | xargs -0 gh release upload "$tag" --clobber
