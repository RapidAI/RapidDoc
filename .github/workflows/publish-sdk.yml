name: Publish native SDK (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Run on matching sdk-vVERSION tag; original Python uses separate vVERSION tags
        default: '0.1.0'
        required: true
        type: string
      target:
        description: Publish one destination at a time
        type: choice
        options: [artifacts-only, pypi, npm, maven, github]
        default: artifacts-only
      publish:
        description: Actually upload to the selected public registry
        type: boolean
        default: false
      include_cuda:
        description: Requires configured Linux AND Windows self-hosted CUDA runners
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sdk-publish-${{ inputs.version }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/release/common.py', os.environ['VERSION']] +
                         (['--publishing'] if os.environ['PUBLISH'] == 'true' else []), check=True)

  build:
    needs: guard
    uses: ./.github/workflows/sdk-build.yml
    with:
      version: ${{ inputs.version }}
      include_cuda: ${{ inputs.include_cuda }}

  pypi:
    if: inputs.publish && inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-22.04
    environment: sdk-pypi
    permissions:
      contents: read
      id-token: write
    env:
      PYPI_RUST_TOKEN: ${{ secrets.PYPI_RUST_TOKEN || secrets.RAPID_DOC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
      - name: Select one wheel per OS (CUDA-capable build when requested)
        shell: python
        run: |
          from pathlib import Path
          import shutil
          destination = Path('dist'); destination.mkdir()
          for os_name in ['windows', 'linux']:
            paths = sorted(Path('artifacts').glob('sdk-' + os_name + '-*/python/*.whl'))
            cuda = [p for p in paths if p.parent.parent.name.endswith('-cuda')]
            selected = cuda or paths
            if len(selected) != 1: raise ValueError(f'Expected exactly one selected wheel for {os_name}: {selected}')
            shutil.copy2(selected[0], destination / selected[0].name)
      - name: Publish with PyPI Trusted Publishing
        if: env.PYPI_RUST_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish with configured PyPI token
        if: env.PYPI_RUST_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_RUST_TOKEN }}

  npm:
    if: inputs.publish && inputs.target == 'npm'
    needs: build
    runs-on: ubuntu-22.04
    environment: sdk-npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
      - name: Assemble the cross-platform public package
        run: python scripts/release/npm_packages.py --output build/release/npm-root
      - name: Publish platform packages before loader (OIDC or bootstrap token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: python scripts/release/publish_npm.py

  maven:
    if: inputs.target == 'maven'
    needs: build
    runs-on: ubuntu-22.04
    environment: sdk-maven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
      - name: Assemble/sign Maven Central bundle; upload only when explicitly enabled
        env:
          PUBLISH: ${{ inputs.publish }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/release/publish_central.py', '--artifacts', 'artifacts'] +
                         (['--publish'] if os.environ['PUBLISH'] == 'true' else []), check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maven-deployment-receipt
          path: |
            build/release/central-deployment-id.txt
            build/release/central-status.json

  github:
    if: inputs.publish && inputs.target == 'github'
    needs: build
    runs-on: ubuntu-22.04
    environment: sdk-github
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: artifacts
      - name: Create/update draft release and publish the Go submodule tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sdk-v$VERSION"
          go_tag="bindings/go/v$VERSION"
          commit="$(git rev-parse HEAD)"
          if git rev-parse "$go_tag" >/dev/null 2>&1; then
            test "$(git rev-parse "$go_tag^{commit}")" = "$commit"
          else
            git tag "$go_tag" "$commit"
            git push origin "refs/tags/$go_tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --title "Native SDK $VERSION" --generate-notes
          fi
          find artifacts -name 'rapiddoc-native-*.zip' -print0 | xargs -0 gh release upload "$tag" --clobber
