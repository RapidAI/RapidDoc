name: Check or publish Rust crates (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        default: '0.1.1'
        required: true
        type: string
      start_at:
        description: Resume from this crate; empty starts from the first crate
        default: ''
        type: string
      publish:
        description: Upload after verifying all extracted crate packages
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  crates:
    runs-on: ubuntu-22.04
    environment: sdk-crates
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sdk-v${{ inputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.92.0'
      - name: Native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build nasm
      - name: Version and package readiness guards
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release/common.py "$VERSION"
      - name: Check packages or publish in dependency order
        env:
          PUBLISH: ${{ inputs.publish }}
          START_AT: ${{ inputs.start_at }}
          RELEASE_VERSION: ${{ inputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: python
        run: |
          import datetime, email.utils, os, re, subprocess, sys, time
          sys.path.insert(0, 'scripts/release')
          import crates
          from common import check_version
          publish = os.environ['PUBLISH'] == 'true'
          start = os.environ['START_AT']
          if start and start not in crates.ORDER: raise ValueError('Unknown resume crate: ' + start)
          # checkout above always selects the canonical SDK release tag, even
          # when this updated publishing workflow is dispatched from main.
          expected = subprocess.check_output(['git', 'rev-parse', 'sdk-v' + os.environ['RELEASE_VERSION'] + '^{commit}'], text=True).strip()
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected: raise ValueError('Checkout differs from SDK release tag')
          os.environ['GITHUB_REF'] = 'refs/tags/sdk-v' + os.environ['RELEASE_VERSION']
          check_version(os.environ['RELEASE_VERSION'], publishing=publish)
          subprocess.run([sys.executable, 'scripts/release/crates.py'], check=True)
          if publish:
            if not os.environ.get('CARGO_REGISTRY_TOKEN'): raise ValueError('Configure CARGO_REGISTRY_TOKEN')
            for name in crates.ORDER[crates.ORDER.index(start) if start else 0:]:
              if crates.published(name):
                print('Already published:', name, crates.package_version(name), flush=True)
                continue
              command = ['cargo', 'publish', '--locked', '--no-default-features', '-p', name]
              network_retries = 0
              while True:
                result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
                print(result.stdout, flush=True)
                if result.returncode == 0: break
                if any(message in result.stdout for message in ('Connection reset by peer', 'SSL connect error', 'Connection timed out')) and network_retries < 3:
                  network_retries += 1
                  print('Transient registry connection failure; retry', network_retries, flush=True)
                  time.sleep(30)
                  continue
                retry = re.search(r'Please try again after (.+? GMT)', result.stdout)
                if '429 Too Many Requests' not in result.stdout or not retry:
                  raise subprocess.CalledProcessError(result.returncode, command)
                until = email.utils.parsedate_to_datetime(retry[1])
                delay = max(1, (until - datetime.datetime.now(datetime.timezone.utc)).total_seconds() + 5)
                print('crates.io rate limit; waiting until', until.isoformat(), flush=True)
                time.sleep(delay)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crates-readiness
          path: |
            build/release/crates-readiness.json
            target/package/*.crate
