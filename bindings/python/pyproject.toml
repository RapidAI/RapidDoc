[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "rapid-doc-rust"
version = "0.1.1"
requires-python = ">=3.10"
description = "RapidDoc Rust document parser with Python bindings for PDF, DOC, DOCX, XLS, XLSX, PPT and PPTX"
readme = "README.md"
dependencies = ["loguru>=0.6.0", "python-dotenv>=1", "Pillow>=11,<13"]

[project.urls]
Homepage = "https://github.com/RapidAI/RapidDoc"
Documentation = "https://github.com/RapidAI/RapidDoc/blob/main/bindings/python/README.md"
Repository = "https://github.com/RapidAI/RapidDoc"
Issues = "https://github.com/RapidAI/RapidDoc/issues"
Changelog = "https://github.com/RapidAI/RapidDoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Shared Rust engine uses ORT C API 23: runtimes older than 1.23 cannot be used.
# These are compatibility lower bounds, not a claim that every later release is validated.
cpu = ["onnxruntime>=1.23.0"]
gpu = ["onnxruntime-gpu>=1.23.0"]

[project.scripts]
rapid-doc-rust = "rapid_doc_rust.__main__:main"

[tool.maturin]
python-source = "python"
module-name = "rapid_doc_rust._native"
features = ["pyo3/extension-module"]
exclude = ["python/rapid_doc_rust/**/__pycache__/*", "python/rapid_doc_rust/**/*.pyc"]
